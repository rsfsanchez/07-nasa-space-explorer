
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="container">

    <!-- NASA Header -->
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <!-- Date Selection -->
    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button>Get Space Images</button>
    </div>

    <!-- NASA Image Gallery -->
    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>

  </div>

  <!-- Modal Popup for NASA Images -->
  <div id="imageModal" class="modal" hidden>
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <!-- Close Button -->
      <button id="closeModal" class="modal-close" aria-label="Close popup">&times;</button>
      <!-- Larger NASA Image -->
      <img id="modalImage" src="" alt="" />
      <!-- Image Title -->
      <h2 id="modalTitle"></h2>
      <!-- Image Date -->
      <p id="modalDate"></p>
      <!-- NASA Image Explanation -->
      <div id="modalExplanation"></div>
    </div>
  </div>
  <!-- JavaScript Files -->
  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
